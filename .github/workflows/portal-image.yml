# Builds the portal image (portal + cf-tunnel agent, flyctl, sops, claude) on every change
# and pins the new tag into selfhost/k8s/kustomization.yaml; Flux rolls it out within a
# minute. CI never touches the cluster or Hetzner — it only builds and commits.
name: portal-image
on:
  push:
    branches: [main]
    paths:
      - selfhost/portal/**
      - cf-tunnel/**
      - .github/workflows/portal-image.yml
  workflow_dispatch:
concurrency:
  group: portal-image
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/de0ch/claude-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tunnel-pin step diffs the pushed range
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/portal/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pin tag for Flux
        run: |
          set -e
          # direct release tarball: the install_kustomize.sh helper calls the GitHub API unauthenticated and 401s
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          TAG="${{ steps.meta.outputs.tag }}"
          # The tunnel agent and the auth broker run this same image but are pinned SEPARATELY:
          # bump them only if their own files changed in this push, so a portal-only build never
          # restarts the tunnel (it goes down) or the auth broker (it holds the Re-login PTY).
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$GITHUB_SHA~1 $GITHUB_SHA"
          else
            RANGE="$BEFORE $GITHUB_SHA"
          fi
          TUNNEL=$(git diff --name-only $RANGE -- cf-tunnel/ || true)
          BROKER=$(git diff --name-only $RANGE -- selfhost/portal/lib/auth.js selfhost/portal/auth-broker.js || true)
          git config user.name "portal-image bot"; git config user.email "actions@users.noreply.github.com"
          # Pin AFTER syncing to the latest main and retry on push races (two workflows commit
          # pins concurrently; "commit then rebase" conflicts on the pinned line — seen 2026-09-13).
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            ( cd selfhost/k8s
              kustomize edit set image "claude-portal=$IMAGE:$TAG"
              [ -n "$TUNNEL" ] && { echo "cf-tunnel changed; bumping tunnel-agent pin"; kustomize edit set image "claude-tunnel-agent=$IMAGE:$TAG"; }
              [ -n "$BROKER" ] && { echo "auth broker changed; bumping auth-broker pin"; kustomize edit set image "claude-auth-broker=$IMAGE:$TAG"; }
              true )
            git add selfhost/k8s/kustomization.yaml
            if git diff --cached --quiet; then echo "already pinned"; exit 0; fi
            git commit -q -m "k8s: portal image $TAG [skip ci]"
            if git push -q origin HEAD:main; then echo "pinned $TAG"; exit 0; fi
            echo "push rejected (attempt $attempt); retrying"; sleep $((attempt * 5))
          done
          echo "::error::could not push the pin after 5 attempts"; exit 1
