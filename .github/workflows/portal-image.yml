# Builds the portal image (portal + cf-tunnel agent, flyctl, sops, claude) on every change
# and pins the new tag into selfhost/k8s/kustomization.yaml; Flux rolls it out within a
# minute. CI never touches the cluster or Hetzner — it only builds and commits.
name: portal-image
on:
  push:
    branches: [main]
    paths:
      - selfhost/portal/**
      - cf-tunnel/**
      - .github/workflows/portal-image.yml
  workflow_dispatch:
concurrency:
  group: portal-image
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/de0ch/claude-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tunnel-pin step diffs the pushed range
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/portal/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pin tag for Flux
        run: |
          set -e
          # direct release tarball: the install_kustomize.sh helper calls the GitHub API unauthenticated and 401s
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          cd selfhost/k8s && kustomize edit set image "claude-portal=$IMAGE:${{ steps.meta.outputs.tag }}"
          # tunnel agent: same image, separate pin — bump only if cf-tunnel/** changed in this push
          # (a portal-only build must not restart the tunnel pod, or the tunnel goes down)
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- cf-tunnel/ || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD -- cf-tunnel/ || true)
          fi
          if [ -n "$CHANGED" ]; then
            echo "cf-tunnel changed; bumping tunnel-agent pin"; kustomize edit set image "claude-tunnel-agent=$IMAGE:${{ steps.meta.outputs.tag }}"
          fi
          cd "$GITHUB_WORKSPACE"
          git config user.name "portal-image bot"; git config user.email "actions@users.noreply.github.com"
          git add selfhost/k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "k8s: portal image ${{ steps.meta.outputs.tag }} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
