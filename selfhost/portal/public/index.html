<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude sessions</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1a1d21;--muted:#6b7280;--accent:#7c3aed;--accent2:#5b21b6;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--border:#e5e7eb;--input:#fbfbfc}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#171b21;--text:#eceef1;--muted:#9aa1ab;--accent:#a78bfa;--accent2:#7c3aed;--ok:#34d399;--warn:#fbbf24;--err:#f87171;--border:#2a2f37;--input:#12151a}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;padding-bottom:5rem}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:.9rem 1rem;padding-top:max(.9rem,env(safe-area-inset-top));display:flex;align-items:center;gap:.6rem}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  header h1{font-size:1.05rem;font-weight:700}
  header .grow{flex:1}
  .wrap{max-width:820px;margin:0 auto;padding:1rem}
  .tabs{display:flex;gap:.4rem;margin-bottom:1rem}
  .tabs button{flex:1;padding:.6rem;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:10px;font-weight:600;font-size:.9rem}
  .tabs button.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.8rem;transition:opacity .2s}
  .card.pending{opacity:.75}
  .card h3{font-size:1rem;margin-bottom:.2rem;word-break:break-word}
  .row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
  .meta{color:var(--muted);font-size:.85rem;word-break:break-all}
  .pill{font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;display:inline-flex;align-items:center;gap:.3rem}
  .pill.ok{background:rgba(22,163,74,.15);color:var(--ok)}
  .pill.dim{background:rgba(107,114,128,.18);color:var(--muted)}
  .pill.wait{background:rgba(217,119,6,.15);color:var(--warn)}
  .pill.bad{background:rgba(220,38,38,.12);color:var(--err)}
  label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.7rem 0 .3rem}
  input,textarea{width:100%;font-size:1rem;padding:.7rem .8rem;border:1.5px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-family:inherit}
  textarea{min-height:8rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  button.btn{font-size:.9rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;padding:.6rem 1rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;-webkit-tap-highlight-color:transparent}
  button.btn.sm{padding:.4rem .7rem;font-size:.82rem}
  button.ghost{background:none;color:var(--accent);border:1.5px solid var(--border)}
  button.danger{background:none;color:var(--err);border:1.5px solid var(--border)}
  button:disabled{opacity:.55;cursor:default}
  /* post-layout-shift cooldown: destructive buttons are inert + faded for 250ms */
  button.btn.cool{opacity:.3;pointer-events:none;transition:opacity .15s}
  button.btn:active:not(:disabled){transform:scale(.97)}
  .spinner{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  #refreshBtn .ico{display:inline-block;line-height:1}
  #refreshBtn.spinning .ico{animation:spin .8s linear infinite}
  .banner{border-radius:10px;padding:.6rem .8rem;font-size:.85rem;margin-bottom:.8rem}
  .banner.err{background:rgba(220,38,38,.12);color:var(--err)}
  .banner.warn{background:rgba(217,119,6,.12);color:var(--warn)}
  .empty{color:var(--muted);text-align:center;padding:2rem 1rem}
  .hint{font-size:.78rem;color:var(--muted);margin-top:.3rem}
  .spacer{height:.6rem}
  /* Mobile-first bottom sheet (iOS Safari pins default <dialog> to the top). */
  dialog{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;width:100%;max-width:100%;
    max-height:88dvh;overflow:auto;border:none;border-radius:20px 20px 0 0;
    padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
    background:var(--card);color:var(--text);box-shadow:0 -10px 40px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  dialog h3{font-size:1.15rem;margin-bottom:.3rem}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto .8rem}
  label.choice{display:flex;align-items:center;gap:.75rem;padding:.85rem .95rem;border:1.5px solid var(--border);
    border-radius:12px;margin:.4rem 0;font-size:1rem;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    text-transform:none;letter-spacing:0;font-weight:500;color:var(--text)}
  .choice:has(input:checked){border-color:var(--accent);background:rgba(124,58,237,.08)}
  .choice input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
  .choice .t{flex:1;min-width:0;word-break:break-word}
  .choice small{display:block;color:var(--muted);font-size:.78rem}
  .actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;position:sticky;bottom:0;background:var(--card);padding-top:.6rem}
  .actions .btn{padding:.8rem 1.2rem;font-size:1rem}
  @media(min-width:720px){dialog{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);
    width:min(92vw,480px);border-radius:16px;max-height:85vh;padding:1.3rem}.grab{display:none}.wrap{padding:1.5rem}}
  .fab{position:fixed;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));z-index:6}
  .fab button{font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:999px;padding:.9rem 1.3rem;box-shadow:0 6px 20px rgba(124,58,237,.4)}
</style>
</head>
<body>
<header>
  <div class="logo">C</div><h1>Claude sessions</h1><div class="grow"></div>
  <button class="btn ghost sm" id="refreshBtn" onclick="refresh(true)" aria-label="Refresh"><span class="ico">↻</span></button>
</header>
<div class="wrap">
  <div id="banners"></div>
  <div class="tabs">
    <button id="t-sessions" class="on" onclick="tab('sessions')">Sessions</button>
    <button id="t-envs" onclick="tab('envs')">Environments</button>
    <button id="t-repos" onclick="tab('repos')">Repos</button>
  </div>
  <div id="view-sessions"></div>
  <div id="view-envs" hidden></div>
  <div id="view-repos" hidden></div>
</div>
<div class="fab" id="fab"><button onclick="newSession()">+ New session</button></div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>

<script>
const $=s=>document.querySelector(s);
let STATE={environments:{},repos:[],sessions:[],sessionImage:null,flyError:null,hasCreds:true};
let TAB='sessions';
// ---- pending actions: UI acks immediately, real state arrives via polling --------
// key -> label while an action is in flight. Renders consult this so a re-render
// (e.g. from polling) never wipes a pending indicator. Nothing here is optimistic:
// the card's real state only changes when the server reports it.
const PENDING=new Map();
function pend(key,label){label?PENDING.set(key,label):PENDING.delete(key);render();}
function pbtn(key,cls,onclick,label,cool){
  const p=PENDING.get(key);
  if(p)return `<button class="btn ${cls}" disabled><span class="spinner"></span>${esc(p)}</button>`;
  if(cool)return `<button class="btn ${cls} cool" disabled>${esc(label)}</button>`;
  return `<button class="btn ${cls}" onclick="${onclick}">${esc(label)}</button>`;
}
// ---- layout-shift guard: when a list's items change (e.g. one removed), the
// remaining destructive buttons move under the finger. Keep them inert + faded
// for 250ms after any composition change, then re-render them live.
const LAST_KEYS={},COOL_UNTIL={};
function coolAfterShift(view,keys){
  if(LAST_KEYS[view]!==undefined&&LAST_KEYS[view]!==keys){COOL_UNTIL[view]=Date.now()+250;setTimeout(render,270);}
  else if(LAST_KEYS[view]===undefined){LAST_KEYS[view]=keys;}
  LAST_KEYS[view]=keys;
  return Date.now()<(COOL_UNTIL[view]||0);
}

async function api(method,path,body){
  const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const REGION={arn:'Stockholm',fra:'Frankfurt',ams:'Amsterdam',lhr:'London',cdg:'Paris',waw:'Warsaw',mad:'Madrid',iad:'Virginia',ord:'Chicago',sjc:'San Jose',lax:'Los Angeles',sin:'Singapore',nrt:'Tokyo',hkg:'Hong Kong',syd:'Sydney'};
function ago(iso){const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago';}
function tab(t){TAB=t;['sessions','envs','repos'].forEach(x=>{$('#view-'+x).hidden=x!==t;$('#t-'+x).classList.toggle('on',x===t);});$('#fab').style.display=t==='sessions'?'block':'none';render();}

// ---- polling: 15s idle, 2s while something is settling -----------------------
let inflight=false, fastUntil=0;
async function refresh(manual){
  if(inflight)return; inflight=true;
  if(manual)$('#refreshBtn').classList.add('spinning');
  try{STATE=await api('GET','api/state');STATE.flyError=STATE.flyError||null;}
  catch(e){STATE.flyError='load failed: '+e.message;}
  finally{inflight=false;$('#refreshBtn').classList.remove('spinning');}
  render();
}
// poll fast until predicate(STATE) is true or maxMs elapses
function settle(pred,maxMs=90000){fastUntil=Math.max(fastUntil,Date.now()+maxMs);SETTLERS.push({pred,until:Date.now()+maxMs});}
const SETTLERS=[];
setInterval(async()=>{
  const fast=Date.now()<fastUntil;
  const tick=Math.floor(Date.now()/1000);
  if(fast||tick%15===0){await refresh(false);}
  for(let i=SETTLERS.length-1;i>=0;i--){const s=SETTLERS[i];if(s.pred(STATE)||Date.now()>s.until)SETTLERS.splice(i,1);}
  if(!SETTLERS.length)fastUntil=0;
},2000);

// ---- render ---------------------------------------------------------------
function banners(){
  let h='';
  if(STATE.hasCreds===false)h+='<div class="banner err">Controller has no Claude credentials — sessions can\'t authenticate.</div>';
  if(!STATE.sessionImage)h+='<div class="banner warn">No session image deployed yet. Run deploy-session-image.sh.</div>';
  if(STATE.flyError)h+='<div class="banner err">Fly: '+esc(STATE.flyError)+'</div>';
  $('#banners').innerHTML=h;
}
function render(){banners();if(TAB==='sessions')renderSessions();if(TAB==='envs')renderEnvs();if(TAB==='repos')renderRepos();}

function sessionPill(m){
  // Real state only. Fly state first; then whether claude inside has actually come up.
  if(m.state==='destroying'||m.state==='destroyed')return `<span class="pill bad"><span class="spinner"></span>${esc(m.state)}</span>`;
  if(m.state==='created'||m.state==='starting')return `<span class="pill wait"><span class="spinner"></span>creating…</span>`;
  if(m.state==='started'){
    if(!m.status)return `<span class="pill wait"><span class="spinner"></span>booting…</span>`;
    return m.status==='busy'?`<span class="pill wait">working</span>`:`<span class="pill ok">idle</span>`;
  }
  return `<span class="pill dim">${esc(m.state)}</span>`;
}
function renderSessions(){
  // stable order (newest first) so cards never swap between polls
  const s=[...(STATE.sessions||[])].sort((a,b)=>String(b.created||'').localeCompare(String(a.created||''))||String(a.id).localeCompare(String(b.id)));
  const v=$('#view-sessions');
  const cool=coolAfterShift('sessions',s.map(m=>m.id).sort().join('|'));
  if(!s.length){v.innerHTML='<div class="empty">No sessions running.<br>Tap “New session”.</div>';return;}
  v.innerHTML=s.map(m=>{
    // name: whatever claude inside reports (mirrors renames made in the Claude app);
    // until it has booted, the creation name.
    const title=(m.liveName&&m.nameSource&&m.nameSource!=='derived')?m.liveName:(m.label||m.name);
    const busy=PENDING.has('destroy:'+m.id);
    const repos=m.repos?m.repos.split(' ').map(u=>u.split('/').pop().replace(/\.git$/,'')).join(', '):'';
    return `<div class="card${busy?' pending':''}">
    <div class="row" style="justify-content:space-between"><h3>${esc(title)}</h3>${sessionPill(m)}</div>
    <div class="meta">${m.environment?('env: '+esc(m.environment)):''}${repos?(' · '+esc(repos)):''}</div>
    <div class="meta">${esc(REGION[m.region]||m.region||'')}${m.created?' · created '+ago(m.created):''}</div>
    <div class="spacer"></div>
    <div class="row">
      ${pbtn('destroy:'+m.id,'danger sm',`destroy('${m.id}')`,'Destroy',cool)}
    </div>
    <div class="hint">Open the Claude app to chat with this session.</div>
  </div>`}).join('');
}
function renderEnvs(){
  const e=STATE.environments||{};
  const v=$('#view-envs');
  const cool=coolAfterShift('envs',Object.keys(e).sort().join('|'));
  const cards=Object.entries(e).map(([n,d])=>`<div class="card${PENDING.has('env:'+n)?' pending':''}">
    <div class="row" style="justify-content:space-between"><h3>${esc(n)}</h3><span class="meta">${(d.keys||[]).length} keys</span></div>
    <div class="meta">${(d.keys||[]).map(esc).join(', ')||'—'}</div>
    <div class="spacer"></div>
    <div class="row"><button class="btn ghost sm" onclick="editEnv('${esc(n)}')">Edit secrets</button>
      ${pbtn('env:'+n,'danger sm',`delEnv('${esc(n)}')`,'Delete',cool)}</div>
  </div>`).join('');
  v.innerHTML=cards+`<button class="btn" onclick="editEnv('')">+ Add environment</button>`;
}
function renderRepos(){
  const r=STATE.repos||[];
  const v=$('#view-repos');
  const cool=coolAfterShift('repos',r.map(x=>x.name).sort().join('|'));
  const cards=r.map(x=>`<div class="card${PENDING.has('repo:'+x.name)?' pending':''}">
    <div class="row" style="justify-content:space-between"><h3>${esc(x.name)}</h3>
      ${pbtn('repo:'+x.name,'ghost sm',`delRepo('${esc(x.name)}')`,'Remove from list',cool)}</div>
    <div class="meta">${esc(x.url)}</div></div>`).join('');
  const addKey=PENDING.get('repo:add');
  v.innerHTML=(cards||'<div class="empty">No repos yet.</div>')+`
    <div class="card"><label>Add repo (git URL)</label>
      <input id="repo-url" type="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://github.com/owner/repo.git" ${addKey?'disabled':''}>
      <label>Name (optional)</label><input id="repo-title" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="auto from URL" ${addKey?'disabled':''}>
      <div class="spacer"></div>${pbtn('repo:add','',`addRepo()`,'Add repo')}
      <div class="hint">Private repos: add a GITHUB_TOKEN key to the environment you'll use.</div></div>`;
}

// ---- dialogs --------------------------------------------------------------
function dlg(html){$('#dlg-body').innerHTML='<div class="grab"></div>'+html;$('#dlg').showModal();}
function closeDlg(){$('#dlg').close();}
$('#dlg').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDlg();});
// flip a dialog button into a pending state; returns a restore fn
function dlgBusy(btn,label){const html=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spinner"></span>${esc(label)}`;return()=>{btn.disabled=false;btn.innerHTML=html;};}

function newSession(){
  const envs=Object.keys(STATE.environments||{});
  const repos=STATE.repos||[];
  dlg(`<h3>New session</h3>
    <label>Environment</label>
    ${envs.length?envs.map((n,i)=>`<label class="choice"><input type="radio" name="ns-env" value="${esc(n)}" ${i===0?'checked':''}><span class="t">${esc(n)}<small>${(STATE.environments[n].keys||[]).length} keys</small></span></label>`).join('')
      :'<div class="meta">No environments yet — add one in the Environments tab.</div>'}
    <label>Repos</label>
    ${repos.length?repos.map(r=>`<label class="choice"><input type="checkbox" name="ns-repo" value="${esc(r.name)}"><span class="t">${esc(r.name)}<small>${esc(r.url)}</small></span></label>`).join('')
      :'<div class="meta">No repos yet — add some in the Repos tab.</div>'}
    <label>Name (optional)</label><input id="ns-title" type="text" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="e.g. refactor billing module">
    <div class="hint">This exact name shows in the Claude app too. Leave blank for an auto-generated one.</div>
    <div class="actions">
      <button class="btn ghost" onclick="closeDlg()">Cancel</button>
      <button class="btn" id="ns-start" onclick="startSession(this)">Start</button></div>`);
}
async function startSession(btn){
  const env=(document.querySelector('#dlg-body input[name=ns-env]:checked')||{}).value||'';
  const repos=[...document.querySelectorAll('#dlg-body input[name=ns-repo]:checked')].map(c=>c.value);
  const label=$('#ns-title').value.trim();
  const restore=dlgBusy(btn,'Starting…');
  try{
    const r=await api('POST','api/sessions',{environment:env,repos,label});
    closeDlg();
    await refresh(false);                                 // card appears in its REAL state (creating…)
    settle(st=>{const m=(st.sessions||[]).find(x=>x.id===r.id);return !!(m&&m.state==='started'&&m.status);}); // fast-poll until claude is actually up
  }catch(e){restore();alert('Start failed: '+e.message);}
}

async function destroy(id){
  pend('destroy:'+id,'Checking…');
  let msg='Destroy this session?\n\n';
  try{
    const c=await api('GET',`api/sessions/${id}/changes`);
    if(c.checked){
      const dirty=(c.repos||[]).filter(r=>r.uncommitted>0||r.unpushed>0||r.unpushed===-1);
      if(c.status==='busy')msg+='⚠️ Claude is still WORKING in this session.\n\n';
      if(dirty.length){
        msg+='⚠️ Unsaved work will be LOST:\n'+dirty.map(r=>'• '+r.name+': '
          +(r.uncommitted>0?r.uncommitted+' uncommitted file(s)':'')
          +(r.uncommitted>0&&(r.unpushed>0||r.unpushed===-1)?', ':'')
          +(r.unpushed>0?r.unpushed+' unpushed commit(s)':r.unpushed===-1?'branch has no upstream (nothing pushed)':'')).join('\n')+'\n';
      }else if(c.status!=='busy'){msg+='✓ No uncommitted or unpushed changes found.\n';}
    }else{msg+='⚠️ Could not check for unsaved changes ('+(c.reason||'unknown')+').\n';}
  }catch(e){msg+='⚠️ Could not check for unsaved changes.\n';}
  msg+='\nThe container and everything in it will be deleted. Your repos on GitHub are not affected.';
  pend('destroy:'+id,null);
  if(!confirm(msg))return;
  pend('destroy:'+id,'Destroying…');
  try{await api('DELETE','api/sessions/'+id);}catch(e){alert(e.message);}
  pend('destroy:'+id,null);
  await refresh(false);                                   // card shows destroying/destroyed until Fly drops it
  settle(st=>!(st.sessions||[]).some(x=>x.id===id),60000);
}

async function editEnv(name){
  let secrets={};
  if(name){try{const r=await api('GET',`api/environments/${encodeURIComponent(name)}/secrets`);secrets=r.secrets||{};}catch(e){}}
  const text=Object.entries(secrets).map(([k,v])=>`${k}=${v}`).join('\n');
  dlg(`<h3>${name?'Edit ':'New '}environment</h3>
    <label>Name</label><input id="ev-title" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" value="${esc(name)}" ${name?'readonly':''} placeholder="e.g. default">
    <label>Secrets (KEY=VALUE, one per line)</label>
    <textarea id="ev-secrets" placeholder="LOBSTER_TOKEN=...\nSERPAPI_KEY=...">${esc(text)}</textarea>
    <div class="hint">Saved on the controller. Blank value on an existing key deletes it.</div>
    <div class="actions">
      <button class="btn ghost" onclick="closeDlg()">Cancel</button>
      <button class="btn" onclick="saveEnv(this)">Save</button></div>`);
}
async function saveEnv(btn){
  const name=$('#ev-title').value.trim();
  if(!name){alert('name required');return;}
  const secrets={};
  $('#ev-secrets').value.split('\n').forEach(line=>{const i=line.indexOf('=');if(i<1)return;secrets[line.slice(0,i).trim()]=line.slice(i+1);});
  const restore=dlgBusy(btn,'Saving…');
  try{await api('POST','api/environments',{name,secrets});closeDlg();await refresh(false);}
  catch(e){restore();alert(e.message);}
}
async function delEnv(n){
  if(!confirm(`Delete environment "${n}" and its saved secret values?\n\nOnly this dashboard's copy is removed — nothing outside it is affected.`))return;
  pend('env:'+n,'Deleting…');
  try{await api('DELETE','api/environments/'+encodeURIComponent(n));}catch(e){alert(e.message);}
  pend('env:'+n,null);await refresh(false);
}
async function addRepo(){
  const url=$('#repo-url').value.trim(),name=$('#repo-title').value.trim();
  if(!url){alert('url required');return;}
  pend('repo:add','Adding…');
  try{await api('POST','api/repos',{url,name});}catch(e){alert(e.message);}
  pend('repo:add',null);await refresh(false);
}
async function delRepo(n){
  if(!confirm(`Remove "${n}" from this list?\n\nThis only forgets the entry on the dashboard — nothing on GitHub is deleted or changed.`))return;
  pend('repo:'+n,'Removing…');
  try{await api('DELETE','api/repos/'+encodeURIComponent(n));}catch(e){alert(e.message);}
  pend('repo:'+n,null);await refresh(false);
}

tab('sessions');refresh(true);
</script>
</body>
