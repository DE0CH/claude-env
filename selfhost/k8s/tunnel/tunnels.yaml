# cf-tunnel agent (cf-tunnel/agent.js, shipped inside the portal image) exposing
#   https://tunnel.deyaochen.com/t/portal/  -> the `portal` Service (load balancer over portal pods)
# behind Cloudflare Access (Deyao's email, or the service token sessions carry).
# The image is the placeholder `claude-tunnel-agent`, mapped to a portal-image tag in
# selfhost/k8s/kustomization.yaml that CI bumps ONLY when cf-tunnel/** changes — so a portal
# build never restarts this pod and the tunnel stays up across portal rollouts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-portal
  namespace: claude
spec:
  replicas: 1
  # MUST be Recreate: the Worker keeps ONE agent socket per tunnel id and a newcomer takes
  # over, so two agents alive at once replace each other every second and every in-flight
  # request dies with a 502 (seen 2026-09-13 with RollingUpdate). One at a time, short grace.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tunnel-portal
  template:
    metadata:
      labels:
        app: tunnel-portal
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: claude-tunnel-agent
          command: ["node", "/app/cf-tunnel/agent.js"]
          env:
            - name: TUNNEL_ID
              value: portal
            - name: TUNNEL_TARGET
              value: http://portal.claude.svc.cluster.local:80
          envFrom:
            - secretRef:
                name: portal-secrets
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
