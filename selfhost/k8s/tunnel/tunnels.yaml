# cf-tunnel agent (cf-tunnel/agent.js, shipped inside the portal image) exposing
#   https://tunnel.deyaochen.com/t/portal/  -> portal
# behind Cloudflare Access (Deyao's email, or the service token sessions carry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-portal
  namespace: claude
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tunnel-portal
  template:
    metadata:
      labels:
        app: tunnel-portal
    spec:
      containers:
        - name: agent
          image: ghcr.io/de0ch/claude-portal
          command: ["node", "/app/cf-tunnel/agent.js"]
          env:
            - name: TUNNEL_ID
              value: portal
            - name: TUNNEL_TARGET
              value: http://portal.claude.svc.cluster.local:80
          envFrom:
            - secretRef:
                name: portal-secrets
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
