# Flux sync objects — applied once by cluster/cloud-init.sh after `flux install`.
# From then on Flux pulls this public repo every minute and reconciles ./selfhost/k8s,
# decrypting *.sops.yaml Secrets with the `sops-age` secret (created at bootstrap).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: claude-env
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/DE0CH/claude-env
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: selfhost
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: claude-env
  path: ./selfhost/k8s
  prune: true
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
