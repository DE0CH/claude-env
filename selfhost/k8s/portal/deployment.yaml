apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: claude
spec:
  replicas: 1
  # Zero-downtime rollouts: the new pod must be Ready (readinessProbe) before the old one is
  # removed, so the `portal` Service — the load balancer the tunnel agent targets — always has
  # an endpoint. (The tunnel agent itself is a separate Deployment and is not restarted.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      serviceAccountName: portal
      terminationGracePeriodSeconds: 20
      containers:
        - name: portal
          image: ghcr.io/de0ch/claude-portal
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            # lets Node's fetch trust the in-cluster API server
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: PORTAL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPO_URL
              value: https://github.com/DE0CH/claude-env.git
            - name: REPO_BRANCH
              value: main
            - name: FLY_APP
              value: de0ch-claude-sessions
          envFrom:
            - secretRef:
                name: portal-secrets
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          # let the Service drop this pod's endpoint before the process exits
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
