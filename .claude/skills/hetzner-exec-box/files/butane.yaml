variant: flatcar
version: 1.1.0

passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEIeGJ9quHj1tvkeftOu/5JS5XLU1g1s2k+U9eTrG4Am deyao"
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAcFUyRjXXdcHk4r3orGxuBPdNZed150D8FblUvwSo3U jump-debug"

storage:
  files:
    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: |
          hexec
    - path: /opt/exec/server.py
      mode: 0644
      contents:
        local: server.py
    - path: /opt/exec/workspace-init.sh
      mode: 0755
      contents:
        local: workspace-init.sh
    - path: /etc/caddy/Caddyfile
      mode: 0644
      contents:
        local: Caddyfile

systemd:
  units:
    - name: workspace.service
      enabled: true
      contents: |
        [Unit]
        Description=Command-executor workspace container
        Requires=docker.service
        After=docker.service network-online.target
        Wants=network-online.target

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=0
        ExecStartPre=-/usr/bin/docker rm -f workspace
        ExecStartPre=/usr/bin/docker pull debian:stable
        ExecStart=/usr/bin/docker run --rm --name workspace \
          --network host \
          -v /var/lib/exec-work:/root/work \
          -v /opt/exec:/opt/exec:ro \
          debian:stable bash /opt/exec/workspace-init.sh
        ExecStop=-/usr/bin/docker stop workspace

        [Install]
        WantedBy=multi-user.target

    - name: caddy.service
      enabled: true
      contents: |
        [Unit]
        Description=Caddy TLS reverse proxy (API-key gated) for the executor
        Requires=docker.service
        After=docker.service network-online.target workspace.service
        Wants=network-online.target

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=0
        ExecStartPre=-/usr/bin/docker rm -f caddy
        ExecStartPre=/usr/bin/docker pull caddy:2
        ExecStart=/usr/bin/docker run --rm --name caddy \
          --network host \
          -v /etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro \
          -v /var/lib/caddy:/data \
          caddy:2 caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
        ExecStop=-/usr/bin/docker stop caddy

        [Install]
        WantedBy=multi-user.target
